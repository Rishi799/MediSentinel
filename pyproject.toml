[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medisentinel"
version = "0.1.0"
description = "Medication safety and adverse-reaction surveillance (DBMS lab project)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["medisentinel*"]
