# MediSentinel look and feel (Streamlit reads this when started from the repo root)
[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
primaryColor = "#0E7A5C"
backgroundColor = "#F6F9F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#20354A"
linkColor = "#0B6B50"
borderColor = "#E3EAF1"
dataframeBorderColor = "#E8EEF3"
dataframeHeaderBackgroundColor = "#F8FAFC"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
redColor = "#D46A6A"
orangeColor = "#D9A441"
yellowColor = "#D9A441"
blueColor = "#6F94BE"
greenColor = "#4FAE8A"
chartCategoricalColors = ["#0E7A5C", "#65B8AD", "#D9A441", "#8E9CC9", "#D46A6A"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F9F8"
textColor = "#3C4E63"
borderColor = "#E8EEF3"
showSidebarBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
